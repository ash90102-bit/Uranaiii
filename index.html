<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘のタロット占い</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4a843;
      --gold-dim: rgba(212,168,67,.4);
      --gold-glow: rgba(212,168,67,.2);
      --purple-light: #c8b4e8;
      --purple-mid: #9b7dca;
      --text: #e8d5b7;
      --bg-card: rgba(12,2,30,.9);
      --border: rgba(212,168,67,.35);
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;background:#050010;font-family:'Noto Serif JP',serif;color:var(--text);overflow-x:hidden}
    #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:3rem 1.5rem 4rem}

    /* Header */
    .header{text-align:center;margin-bottom:3rem}
    .header-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,4vw,2.8rem);color:var(--gold);text-shadow:0 0 30px rgba(212,168,67,.5);letter-spacing:.08em;margin-bottom:.5rem}
    .header-sub{font-family:'Cinzel',serif;font-size:.9rem;color:var(--purple-light);letter-spacing:.2em;opacity:.8}

    /* Divider */
    .divider{width:100%;max-width:520px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);margin:2rem 0}

    /* Phase containers */
    .phase{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
    .phase.hidden{display:none}

    /* Question phase */
    .question-label{font-size:.9rem;color:var(--purple-light);letter-spacing:.1em;text-align:center;margin-bottom:.5rem}
    .question-area{width:100%;max-width:520px;background:rgba(20,5,45,.8);border:1px solid var(--border);border-radius:12px;padding:1.5rem;backdrop-filter:blur(6px)}
    .question-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(212,168,67,.25);border-radius:8px;color:var(--text);font-family:'Noto Serif JP',serif;font-size:1rem;padding:.9rem 1.1rem;resize:vertical;min-height:90px;outline:none;transition:border-color .3s}
    .question-input:focus{border-color:rgba(212,168,67,.6);box-shadow:0 0 12px rgba(212,168,67,.1)}
    .question-input::placeholder{color:rgba(232,213,183,.3)}

    /* Buttons */
    .btn{font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.12em;padding:.8rem 2.2rem;border-radius:30px;border:none;cursor:pointer;transition:all .3s;outline:none;display:inline-flex;align-items:center;gap:.5rem}
    .btn-gold{background:linear-gradient(135deg,#c9952a,#e8b84b);color:#0a0005;font-weight:700;box-shadow:0 4px 20px rgba(212,168,67,.35)}
    .btn-gold:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(212,168,67,.5)}
    .btn-gold:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .btn-outline{background:transparent;border:1px solid var(--gold-dim);color:var(--gold);padding:.65rem 1.6rem;font-size:.85rem}
    .btn-outline:hover{border-color:var(--gold);background:rgba(212,168,67,.08)}

    /* Spread selection */
    .spread-title{font-family:'Cinzel',serif;font-size:.85rem;color:var(--purple-light);letter-spacing:.18em;text-align:center}
    .spread-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;max-width:520px}
    .spread-card{background:rgba(20,5,45,.85);border:1px solid rgba(212,168,67,.25);border-radius:12px;padding:1.2rem 1rem;cursor:pointer;transition:all .3s;text-align:center;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:.4rem}
    .spread-card:hover{border-color:rgba(212,168,67,.55);background:rgba(30,8,60,.9);transform:translateY(-3px);box-shadow:0 8px 24px rgba(212,168,67,.12)}
    .spread-card.selected{border-color:var(--gold);background:rgba(40,12,70,.9);box-shadow:0 0 20px rgba(212,168,67,.25)}
    .spread-card-name{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);letter-spacing:.06em}
    .spread-card-count{font-size:.78rem;color:var(--purple-light);opacity:.8}
    .spread-card-desc{font-size:.8rem;color:var(--text);opacity:.7;margin-top:.2rem}

    /* Grid pick phase */
    .fan-title{font-family:'Cinzel',serif;font-size:.85rem;color:var(--purple-light);letter-spacing:.15em;text-align:center}
    .pick-counter{font-size:.95rem;color:var(--text);text-align:center;opacity:.88}
    .fan-container{position:relative;width:100%;max-width:680px;margin:.5rem auto}
    .pick-rows{display:flex;flex-direction:column;width:100%;overflow-x:auto;padding-bottom:4px}
    .pick-row{display:flex;flex-wrap:nowrap;padding:4px 0 12px}
    .pick-card{width:56px;height:90px;flex-shrink:0;margin-right:-48px;background:linear-gradient(160deg,#140030,#090018);border:1px solid rgba(212,168,67,.28);border-radius:6px;cursor:pointer;position:relative;transition:margin-right .18s ease,transform .18s ease,box-shadow .18s,border-color .15s;z-index:1}
    .pick-card:last-child{margin-right:0}
    .pick-card-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:5px;pointer-events:none}
    .pick-card-sym{font-size:.85rem;color:rgba(212,168,67,.3)}
    .pick-card:hover{margin-right:-28px;transform:translateY(-10px);box-shadow:0 8px 20px rgba(0,0,0,.5),0 0 12px rgba(212,168,67,.35);border-color:rgba(212,168,67,.6);z-index:30}
    .pick-card.picked{margin-right:-28px;transform:translateY(-12px);border-color:var(--gold);background:linear-gradient(160deg,#1e0042,#0d001e);box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 18px rgba(212,168,67,.6);z-index:30}
    .pick-card.picked .pick-card-sym{color:rgba(212,168,67,.75)}
    @media(max-width:520px){
      .pick-card{width:44px;height:70px;margin-right:-36px}
      .pick-card:hover,.pick-card.picked{margin-right:-20px}
    }

    /* Reading phase */
    .reading-question{font-size:.9rem;color:var(--purple-light);text-align:center;opacity:.8;font-style:italic;max-width:520px}
    .cards-row{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2rem;width:100%;max-width:680px}
    .card-slot{display:flex;flex-direction:column;align-items:center;gap:.6rem}
    .card-position-label{font-size:.92rem;color:var(--purple-light);letter-spacing:.1em;text-align:center;opacity:.85}

    /* Flip card */
    .flip-card{width:124px;height:198px;perspective:900px;cursor:pointer}
    .flip-card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1)}
    .flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}
    .flip-card-face,.flip-card-back{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
    .flip-card-back{background:linear-gradient(160deg,#140030,#090018);border:1.5px solid rgba(212,168,67,.45);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 4px 20px rgba(0,0,0,.6)}
    .flip-card-face{transform:rotateY(180deg);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.7)}

    /* Card face styles per suit */
    .flip-card-face[data-suit="major"]{background:linear-gradient(160deg,#140030,#090018);border:1.5px solid rgba(212,168,67,.55)}
    .flip-card-face[data-suit="wands"]{background:linear-gradient(160deg,#2a0a00,#180500);border:1.5px solid rgba(212,120,67,.55)}
    .flip-card-face[data-suit="cups"]{background:linear-gradient(160deg,#001830,#000d1a);border:1.5px solid rgba(67,168,212,.55)}
    .flip-card-face[data-suit="swords"]{background:linear-gradient(160deg,#0a0f20,#050812);border:1.5px solid rgba(141,164,200,.55)}
    .flip-card-face[data-suit="pentacles"]{background:linear-gradient(160deg,#061a06,#020c02);border:1.5px solid rgba(106,184,106,.55)}

    /* Card content — reversed shown via border/badge, not rotation */
    .card-content{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5rem .3rem;gap:.25rem}
    .flip-card-face.is-reversed{box-shadow:0 4px 24px rgba(0,0,0,.7),0 0 18px rgba(200,60,40,.3)!important;border-color:rgba(200,70,50,.75)!important}

    .card-sym{font-size:2.4rem;line-height:1}
    .card-num{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;opacity:.7}
    .card-name-ja{font-family:'Noto Serif JP',serif;font-size:.8rem;text-align:center;line-height:1.3;font-weight:700}
    .card-name-en{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.05em;opacity:.6;text-align:center}
    .card-reversed-badge{font-size:.6rem;letter-spacing:.08em;padding:.15rem .5rem;border-radius:4px;margin-top:.2rem;background:rgba(200,60,40,.25)!important;color:#e08070!important;border:1px solid rgba(200,60,40,.5)!important}

    /* Suit accent colors for text */
    [data-suit="major"] .card-sym,[data-suit="major"] .card-name-ja,[data-suit="major"] .card-num{color:#d4a843}
    [data-suit="major"] .card-reversed-badge{background:rgba(212,168,67,.15);color:#d4a843;border:1px solid rgba(212,168,67,.3)}
    [data-suit="wands"] .card-sym,[data-suit="wands"] .card-name-ja,[data-suit="wands"] .card-num{color:#d47843}
    [data-suit="wands"] .card-reversed-badge{background:rgba(212,120,67,.15);color:#d47843;border:1px solid rgba(212,120,67,.3)}
    [data-suit="cups"] .card-sym,[data-suit="cups"] .card-name-ja,[data-suit="cups"] .card-num{color:#43a8d4}
    [data-suit="cups"] .card-reversed-badge{background:rgba(67,168,212,.15);color:#43a8d4;border:1px solid rgba(67,168,212,.3)}
    [data-suit="swords"] .card-sym,[data-suit="swords"] .card-name-ja,[data-suit="swords"] .card-num{color:#8da4c8}
    [data-suit="swords"] .card-reversed-badge{background:rgba(141,164,200,.15);color:#8da4c8;border:1px solid rgba(141,164,200,.3)}
    [data-suit="pentacles"] .card-sym,[data-suit="pentacles"] .card-name-ja,[data-suit="pentacles"] .card-num{color:#6ab86a}
    [data-suit="pentacles"] .card-reversed-badge{background:rgba(106,184,106,.15);color:#6ab86a;border:1px solid rgba(106,184,106,.3)}

    /* Reading result */
    .reading-result{width:100%;max-width:680px;display:flex;flex-direction:column;gap:1.2rem;margin-top:.5rem}
    .reading-result.hidden{display:none}
    .reading-card-block{background:rgba(12,2,30,.85);border-radius:14px;padding:1.4rem 1.6rem;backdrop-filter:blur(8px);border-left:3px solid var(--gold)}
    .reading-card-block[data-suit="wands"]{border-left-color:#d47843}
    .reading-card-block[data-suit="cups"]{border-left-color:#43a8d4}
    .reading-card-block[data-suit="swords"]{border-left-color:#8da4c8}
    .reading-card-block[data-suit="pentacles"]{border-left-color:#6ab86a}
    .reading-block-header{display:flex;align-items:center;gap:.7rem;margin-bottom:.75rem;flex-wrap:wrap}
    .reading-position{font-size:.85rem;color:var(--purple-light);letter-spacing:.12em;opacity:.8}
    .reading-card-title{font-family:'Cinzel',serif;font-size:1.15rem;color:var(--gold);letter-spacing:.06em}
    .reading-card-block[data-suit="wands"] .reading-card-title{color:#d47843}
    .reading-card-block[data-suit="cups"] .reading-card-title{color:#43a8d4}
    .reading-card-block[data-suit="swords"] .reading-card-title{color:#8da4c8}
    .reading-card-block[data-suit="pentacles"] .reading-card-title{color:#6ab86a}
    .reading-reversed-tag{font-size:.68rem;padding:.2rem .6rem;border-radius:20px;background:rgba(212,168,67,.12);border:1px solid rgba(212,168,67,.3);color:var(--gold)}
    .reading-kw{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.65rem}
    .reading-kw span{font-size:.84rem;padding:.28rem .72rem;border-radius:20px;background:rgba(212,168,67,.08);border:1px solid rgba(212,168,67,.2);color:var(--gold);letter-spacing:.05em}
    .reading-card-block[data-suit="wands"] .reading-kw span{background:rgba(212,120,67,.08);border-color:rgba(212,120,67,.2);color:#d47843}
    .reading-card-block[data-suit="cups"] .reading-kw span{background:rgba(67,168,212,.08);border-color:rgba(67,168,212,.2);color:#43a8d4}
    .reading-card-block[data-suit="swords"] .reading-kw span{background:rgba(141,164,200,.08);border-color:rgba(141,164,200,.2);color:#8da4c8}
    .reading-card-block[data-suit="pentacles"] .reading-kw span{background:rgba(106,184,106,.08);border-color:rgba(106,184,106,.2);color:#6ab86a}
    .reading-msg{font-size:1.02rem;line-height:1.9;color:var(--text);opacity:.92}

    /* Shuffle animation */
    .shuffle-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(5,0,16,.85);backdrop-filter:blur(4px);flex-direction:column;gap:1.5rem}
    .shuffle-overlay.hidden{display:none}
    .shuffle-text{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);letter-spacing:.2em;animation:pulse 1.5s ease-in-out infinite}
    .shuffle-cards{display:flex;gap:.5rem}
    .shuffle-mini{width:32px;height:52px;border-radius:5px;background:linear-gradient(160deg,#140030,#090018);border:1.5px solid rgba(212,168,67,.45);animation:shuffleAnim 1.2s ease-in-out infinite}
    .shuffle-mini:nth-child(2){animation-delay:.15s}
    .shuffle-mini:nth-child(3){animation-delay:.3s}
    .shuffle-mini:nth-child(4){animation-delay:.45s}
    .shuffle-mini:nth-child(5){animation-delay:.6s}
    @keyframes shuffleAnim{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

    /* Misc */
    .star-deco{color:var(--gold);opacity:.5;font-size:.9rem;letter-spacing:.4em}
    .reset-area{margin-top:2rem;text-align:center}

    @media(max-width:520px){
      .spread-grid{grid-template-columns:1fr}
      .cards-row{gap:.8rem}
      .flip-card{width:96px;height:154px}
      .reading-card-block{padding:1rem 1.1rem}
    }

    /* Flip effects */
    .sparkle{position:fixed;width:5px;height:5px;border-radius:50%;background:var(--gold);pointer-events:none;z-index:9999;animation:sparkleFly .75s ease-out forwards}
    @keyframes sparkleFly{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0)}}
    .flip-ring{position:absolute;inset:-4px;border-radius:14px;border:2px solid var(--gold);pointer-events:none;animation:ringExpand .65s ease-out forwards;z-index:5}
    @keyframes ringExpand{from{opacity:.85;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}

    /* Settings button */
    .settings-btn{position:fixed;top:1rem;right:1rem;z-index:200;background:rgba(20,5,45,.88);border:1px solid var(--border);border-radius:50%;width:40px;height:40px;color:var(--gold);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:all .3s;line-height:1}
    .settings-btn:hover{border-color:var(--gold);box-shadow:0 0 14px var(--gold-glow)}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;backdrop-filter:blur(2px)}
    .modal-overlay.hidden,.settings-modal.hidden{display:none}
    .settings-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:400;background:rgba(12,2,30,.97);border:1px solid var(--border);border-radius:16px;padding:1.8rem;width:90%;max-width:380px;display:flex;flex-direction:column;gap:1.1rem}
    .modal-title{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);letter-spacing:.15em;text-align:center}
    .modal-desc{font-size:.84rem;color:var(--purple-light);line-height:1.68}
    .modal-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.88rem;padding:.72rem 1rem;outline:none;font-family:monospace;transition:border-color .3s}
    .modal-input:focus{border-color:rgba(212,168,67,.6)}
    .modal-btns{display:flex;gap:.8rem}
    .modal-btns .btn{flex:1;justify-content:center;font-size:.82rem;padding:.7rem}

    /* AI reading */
    .ai-reading-block{background:rgba(212,168,67,.04);border:1px solid rgba(212,168,67,.38);border-radius:14px;padding:1.4rem 1.6rem;margin-top:.5rem}
    .ai-reading-block.hidden{display:none}
    .ai-reading-header{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
    .ai-reading-icon{font-size:1.3rem}
    .ai-reading-label{font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);letter-spacing:.18em}
    .ai-reading-text{font-size:1rem;line-height:1.95;color:var(--text);white-space:pre-wrap;min-height:2rem}
    .ai-cursor::after{content:'▋';color:var(--gold);animation:blink .75s step-end infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .ai-error{color:#e08070;font-size:.9rem}
    .api-key-hint{font-size:.8rem;color:var(--purple-mid);text-align:center;opacity:.75}
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="app">
  <header class="header">
    <h1 class="header-title">✦ 神秘のタロット ✦</h1>
    <p class="header-sub">MYSTIC TAROT ORACLE</p>
  </header>

  <!-- Phase: Question -->
  <section class="phase" id="phase-question">
    <div class="divider"></div>
    <p class="question-label">✦ 占いたいことを入力してください ✦</p>
    <div class="question-area">
      <textarea class="question-input" id="question-input" placeholder="例：仕事の方向性について、恋愛について、今後の人生について…"></textarea>
    </div>
    <button class="btn btn-gold" id="btn-to-spread">スプレッドを選ぶ ›</button>
    <div class="divider"></div>
  </section>

  <!-- Phase: Spread selection -->
  <section class="phase hidden" id="phase-spread">
    <p class="spread-title">✦ スプレッドを選択してください ✦</p>
    <div class="spread-grid" id="spread-grid"></div>
    <button class="btn btn-gold" id="btn-to-pick" disabled>カードを選ぶ ›</button>
    <div class="divider"></div>
  </section>

  <!-- Phase: Fan pick -->
  <section class="phase hidden" id="phase-pick">
    <p class="fan-title" id="fan-title">✦ カードに手を触れてください ✦</p>
    <p class="pick-counter" id="pick-counter"></p>
    <div class="fan-container" id="fan-container"></div>
    <button class="btn btn-gold hidden" id="btn-confirm-pick">このカードで占う ›</button>
    <div class="divider"></div>
  </section>

  <!-- Phase: Reading -->
  <section class="phase hidden" id="phase-reading">
    <p class="reading-question" id="reading-question-display"></p>
    <div class="cards-row" id="cards-row"></div>
    <div class="reading-result hidden" id="reading-result"></div>
    <div class="reset-area">
      <button class="btn btn-outline hidden" id="btn-reset">もう一度占う</button>
    </div>
    <div class="divider"></div>
  </section>
</div>

<!-- Settings button -->
<button class="settings-btn" onclick="openSettings()" title="APIキー設定">⚙</button>

<!-- Settings modal -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeSettings()"></div>
<div class="settings-modal hidden" id="settings-modal">
  <div class="modal-title">✦ API 設定 ✦</div>
  <p class="modal-desc">Anthropic APIキーを設定すると、引いたカードと質問内容をもとにAIが個別のリーディングを生成します。キーはブラウザのローカルストレージにのみ保存されます。</p>
  <input class="modal-input" type="password" id="api-key-input" placeholder="sk-ant-api03-..." spellcheck="false">
  <div class="modal-btns">
    <button class="btn btn-gold" onclick="saveApiKey()">保存</button>
    <button class="btn btn-outline" onclick="closeSettings()">閉じる</button>
  </div>
</div>

<!-- Shuffle overlay -->
<div class="shuffle-overlay hidden" id="shuffle-overlay">
  <div class="shuffle-cards">
    <div class="shuffle-mini"></div>
    <div class="shuffle-mini"></div>
    <div class="shuffle-mini"></div>
    <div class="shuffle-mini"></div>
    <div class="shuffle-mini"></div>
  </div>
  <p class="shuffle-text">カードをシャッフル中…</p>
</div>

<script>
// ───────────────────────────────────────────────
// STARFIELD
// ───────────────────────────────────────────────
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [], shoots = [];
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  function mkStar(){ return { x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.2, a:Math.random(), da:(Math.random()-.5)*.008 }; }
  function init(){ resize(); stars=[]; for(let i=0;i<180;i++) stars.push(mkStar()); }
  function mkShoot(){
    const x=Math.random()*W*.7, y=Math.random()*H*.4;
    return { x, y, vx:6+Math.random()*5, vy:3+Math.random()*3, life:1, decay:.018+Math.random()*.012 };
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.a += s.da;
      if(s.a<0||s.a>1) s.da*=-1;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

    shoots = shoots.filter(s=>s.life>0);
    shoots.forEach(s=>{
      const tail=60;
      const grd=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*tail/s.vx,s.y-s.vy*tail/s.vy);
      grd.addColorStop(0,`rgba(212,168,67,${s.life*.9})`);
      grd.addColorStop(1,'rgba(212,168,67,0)');
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*8,s.y-s.vy*8);
      ctx.strokeStyle=grd; ctx.lineWidth=1.5; ctx.stroke();
      s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
    });
    requestAnimationFrame(draw);
  }

  init(); draw();

// ───────────────────────────────────────────────
// APP STATE
// ───────────────────────────────────────────────
let state = {
  question: '',
  spread: null,
  pickedIndices: [],
  drawnCards: [], // {card, reversed}
  flippedCount: 0
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ───────────────────────────────────────────────
// PHASE HELPERS
// ───────────────────────────────────────────────
function showPhase(id) {
  document.querySelectorAll('.phase').forEach(el => el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function showShuffle(cb) {
  const ov = document.getElementById('shuffle-overlay');
  ov.classList.remove('hidden');
  setTimeout(() => {
    ov.classList.add('hidden');
    cb();
  }, 1800);
}

// ───────────────────────────────────────────────
// PHASE: QUESTION
// ───────────────────────────────────────────────
document.getElementById('btn-to-spread').addEventListener('click', () => {
  const q = document.getElementById('question-input').value.trim();
  state.question = q || '（質問なし）';
  buildSpreadGrid();
  showPhase('phase-spread');
});

// ───────────────────────────────────────────────
// PHASE: SPREAD SELECTION
// ───────────────────────────────────────────────
function buildSpreadGrid() {
  const grid = document.getElementById('spread-grid');
  grid.innerHTML = '';
  state.spread = null;
  document.getElementById('btn-to-pick').disabled = true;

  SPREADS.forEach(sp => {
    const card = document.createElement('div');
    card.className = 'spread-card';
    card.innerHTML = `
      <div class="spread-card-name">${sp.name}</div>
      <div class="spread-card-count">${sp.count}枚引き</div>
      <div class="spread-card-desc">「${sp.desc}」</div>
    `;
    card.addEventListener('click', () => {
      grid.querySelectorAll('.spread-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      state.spread = sp;
      document.getElementById('btn-to-pick').disabled = false;
    });
    grid.appendChild(card);
  });
}

document.getElementById('btn-to-pick').addEventListener('click', () => {
  showShuffle(() => buildGridPick());
});

// ───────────────────────────────────────────────
// PHASE: GRID PICK (全78枚)
// ───────────────────────────────────────────────
function buildGridPick() {
  state.pickedIndices = [];
  showPhase('phase-pick');

  const sp = state.spread;
  document.getElementById('fan-title').textContent = `✦ ${sp.name}のカードを選んでください ✦`;
  updatePickCounter();

  const container = document.getElementById('fan-container');
  container.innerHTML = '';

  const rowsEl = document.createElement('div');
  rowsEl.className = 'pick-rows';

  const rowEl = document.createElement('div');
  rowEl.className = 'pick-row';
  for (let i = 0; i < 78; i++) {
    const el = document.createElement('div');
    el.className = 'pick-card';
    el.innerHTML = '<div class="pick-card-inner"><span class="pick-card-sym">✦</span></div>';
    el.addEventListener('click', () => handleGridPick(el, i));
    rowEl.appendChild(el);
  }
  rowsEl.appendChild(rowEl);

  container.appendChild(rowsEl);
  document.getElementById('btn-confirm-pick').classList.add('hidden');
}

function handleGridPick(el, idx) {
  const sp = state.spread;
  if (el.classList.contains('picked')) {
    el.classList.remove('picked');
    state.pickedIndices = state.pickedIndices.filter(x => x !== idx);
  } else {
    if (state.pickedIndices.length >= sp.count) return;
    el.classList.add('picked');
    state.pickedIndices.push(idx);
    // pulse feedback
    el.animate([{transform:'rotate(var(--rot,0deg)) scale(1.18)'},{transform:'rotate(var(--rot,0deg)) scale(1)'}],{duration:200,easing:'ease-out'});
  }
  updatePickCounter();
  document.getElementById('btn-confirm-pick').classList.toggle(
    'hidden', state.pickedIndices.length !== sp.count
  );
}

function updatePickCounter() {
  const sp = state.spread;
  const picked = state.pickedIndices.length;
  document.getElementById('pick-counter').textContent =
    `${sp.count}枚選んでください (${picked}/${sp.count})`;
}

document.getElementById('btn-confirm-pick').addEventListener('click', () => {
  // Draw cards randomly (with reversal)
  const shuffled = shuffle(CARDS);
  state.drawnCards = shuffled.slice(0, state.spread.count).map(card => ({
    card,
    reversed: Math.random() < 0.3
  }));
  showShuffle(() => buildReading());
});

// ───────────────────────────────────────────────
// PHASE: READING
// ───────────────────────────────────────────────
function buildReading() {
  showPhase('phase-reading');
  state.flippedCount = 0;

  document.getElementById('reading-question-display').textContent =
    `「 ${state.question} 」`;

  const row = document.getElementById('cards-row');
  row.innerHTML = '';

  const result = document.getElementById('reading-result');
  result.innerHTML = '';
  result.classList.add('hidden');

  document.getElementById('btn-reset').classList.add('hidden');

  state.drawnCards.forEach((drawn, i) => {
    const pos = state.spread.positions[i];
    const slot = document.createElement('div');
    slot.className = 'card-slot';

    const posLabel = document.createElement('div');
    posLabel.className = 'card-position-label';
    posLabel.textContent = pos;

    const flipCard = document.createElement('div');
    flipCard.className = 'flip-card';
    flipCard.title = 'クリックしてカードをめくる';

    const inner = document.createElement('div');
    inner.className = 'flip-card-inner';

    // Back face
    const back = document.createElement('div');
    back.className = 'flip-card-back';
    back.textContent = '✦';

    // Front face
    const front = document.createElement('div');
    front.className = 'flip-card-face';
    front.dataset.suit = drawn.card.suit;

    if (drawn.reversed) front.classList.add('is-reversed');

    const content = document.createElement('div');
    content.className = 'card-content';

    const sym = document.createElement('div');
    sym.className = 'card-sym';
    sym.textContent = drawn.card.sym;

    const num = document.createElement('div');
    num.className = 'card-num';
    num.textContent = drawn.card.n;

    const nameJa = document.createElement('div');
    nameJa.className = 'card-name-ja';
    nameJa.textContent = drawn.card.ja;

    const nameEn = document.createElement('div');
    nameEn.className = 'card-name-en';
    nameEn.textContent = drawn.card.en;

    content.append(sym, num, nameJa, nameEn);

    if (drawn.reversed) {
      const badge = document.createElement('div');
      badge.className = 'card-reversed-badge';
      badge.textContent = '逆位置';
      content.appendChild(badge);
    }

    front.appendChild(content);
    inner.append(back, front);
    flipCard.appendChild(inner);

    let flipped = false;
    flipCard.addEventListener('click', () => {
      if (flipped) return;
      flipped = true;
      flipCard.classList.add('flipped');
      flipCard.style.cursor = 'default';
      triggerFlipEffect(flipCard);
      state.flippedCount++;
      if (state.flippedCount === state.drawnCards.length) {
        setTimeout(() => showReadingResult(), 700);
      }
    });

    slot.append(posLabel, flipCard);
    row.appendChild(slot);
  });
}

function showReadingResult() {
  const result = document.getElementById('reading-result');
  result.innerHTML = '';
  result.classList.remove('hidden');

  state.drawnCards.forEach((drawn, i) => {
    const pos = state.spread.positions[i];
    const meaning = drawn.reversed ? drawn.card.rv : drawn.card.up;

    const block = document.createElement('div');
    block.className = 'reading-card-block';
    block.dataset.suit = drawn.card.suit;

    const header = document.createElement('div');
    header.className = 'reading-block-header';

    const posSpan = document.createElement('span');
    posSpan.className = 'reading-position';
    posSpan.textContent = pos;

    const title = document.createElement('span');
    title.className = 'reading-card-title';
    title.textContent = `${drawn.card.sym} ${drawn.card.ja}`;

    header.append(posSpan, title);

    if (drawn.reversed) {
      const tag = document.createElement('span');
      tag.className = 'reading-reversed-tag';
      tag.textContent = '逆位置';
      header.appendChild(tag);
    }

    const kwRow = document.createElement('div');
    kwRow.className = 'reading-kw';
    meaning.kw.forEach(k => {
      const s = document.createElement('span');
      s.textContent = k;
      kwRow.appendChild(s);
    });

    const msg = document.createElement('p');
    msg.className = 'reading-msg';
    msg.textContent = meaning.msg;

    block.append(header, kwRow, msg);
    result.appendChild(block);
  });

  // AI reading block
  const aiBlock = document.createElement('div');
  aiBlock.className = 'ai-reading-block hidden';
  aiBlock.id = 'ai-reading-block';
  aiBlock.innerHTML = `
    <div class="ai-reading-header">
      <span class="ai-reading-icon">✨</span>
      <span class="ai-reading-label">AI タロットリーディング</span>
    </div>
    <div class="ai-reading-text ai-cursor" id="ai-reading-text"></div>
  `;
  result.appendChild(aiBlock);

  document.getElementById('btn-reset').classList.remove('hidden');

  const hasKey = !!localStorage.getItem('tarot_api_key');
  if (hasKey) {
    generateAIReading();
  } else {
    const hint = document.createElement('p');
    hint.className = 'api-key-hint';
    hint.textContent = '⚙ APIキーを設定するとAIによる個別リーディングが表示されます';
    result.appendChild(hint);
  }
}

// ───────────────────────────────────────────────
// FLIP EFFECTS
// ───────────────────────────────────────────────
function triggerFlipEffect(flipCard) {
  const ring = document.createElement('div');
  ring.className = 'flip-ring';
  flipCard.style.position = 'relative';
  flipCard.appendChild(ring);
  setTimeout(() => ring.remove(), 700);

  const rect = flipCard.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['#d4a843','#e8c870','#fff3b0','#c8b4e8'];

  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2 + Math.random() * .3;
    const dist = 40 + Math.random() * 40;
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i%colors.length]};
      width:${3+Math.random()*4}px;height:${3+Math.random()*4}px;
      animation-delay:${Math.random()*.12}s;animation-duration:${.55+Math.random()*.3}s`;
    sp.style.setProperty('--dx', `${Math.cos(angle)*dist}px`);
    sp.style.setProperty('--dy', `${Math.sin(angle)*dist}px`);
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 1000);
  }
}

// ───────────────────────────────────────────────
// CLAUDE API
// ───────────────────────────────────────────────
async function generateAIReading() {
  const apiKey = localStorage.getItem('tarot_api_key');
  if (!apiKey) return;

  const aiBlock = document.getElementById('ai-reading-block');
  const aiText = document.getElementById('ai-reading-text');
  if (!aiBlock || !aiText) return;

  aiBlock.classList.remove('hidden');
  aiText.textContent = '';
  aiText.classList.add('ai-cursor');

  const sp = state.spread;
  const cardList = state.drawnCards.map((d, i) =>
    `・${sp.positions[i]}：${d.card.ja}（${d.reversed ? '逆位置' : '正位置'}）— ${(d.reversed ? d.card.rv : d.card.up).kw.join('、')}`
  ).join('\n');

  const prompt = `あなたは深い洞察力を持つタロット占い師です。以下の質問と引いたカードをもとに、質問者の状況に寄り添った具体的で示唆に富む占い結果を日本語でお伝えください。

【質問】${state.question}
【スプレッド】${sp.name}（${sp.desc || sp.positions.join('・')}）
【引いたカード】
${cardList}

各カードが質問に対してどのような意味を持つかを読み解き、最後に総合的なアドバイスをお伝えください。神秘的でありながら実践的な内容で、450文字程度でお願いします。`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-allow-browser': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 700,
        stream: true,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      aiText.classList.remove('ai-cursor');
      aiText.innerHTML = `<span class="ai-error">エラー: ${err.error?.message || 'API呼び出しに失敗しました (ステータス ' + resp.status + ')'}</span>`;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const json = JSON.parse(data);
          if (json.type === 'content_block_delta' && json.delta?.text) {
            aiText.textContent += json.delta.text;
          }
        } catch {}
      }
    }
  } catch (e) {
    aiText.classList.remove('ai-cursor');
    aiText.innerHTML = `<span class="ai-error">通信エラー: ${e.message}</span>`;
    return;
  }

  aiText.classList.remove('ai-cursor');
}

// ───────────────────────────────────────────────
// SETTINGS MODAL
// ───────────────────────────────────────────────
function openSettings() {
  document.getElementById('api-key-input').value = localStorage.getItem('tarot_api_key') || '';
  document.getElementById('settings-modal').classList.remove('hidden');
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeSettings() {
  document.getElementById('settings-modal').classList.add('hidden');
  document.getElementById('modal-overlay').classList.add('hidden');
}
function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  if (key) localStorage.setItem('tarot_api_key', key);
  else localStorage.removeItem('tarot_api_key');
  closeSettings();
}

// ───────────────────────────────────────────────
// RESET
// ───────────────────────────────────────────────
document.getElementById('btn-reset').addEventListener('click', () => {
  state = { question: '', spread: null, pickedIndices: [], drawnCards: [], flippedCount: 0 };
  document.getElementById('question-input').value = '';
  showPhase('phase-question');
});
</script>
