<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘のタロット占い</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4a843;
      --gold-dim: rgba(212, 168, 67, 0.4);
      --gold-glow: rgba(212, 168, 67, 0.2);
      --purple-light: #c8b4e8;
      --purple-mid: #9b7dca;
      --text: #e8d5b7;
      --bg-card: rgba(12, 2, 30, 0.9);
      --border: rgba(212, 168, 67, 0.35);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #050010;
      font-family: 'Noto Serif JP', serif;
      color: var(--text);
      overflow-x: hidden;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1.5rem 4rem;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .main-title {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: var(--gold);
      letter-spacing: 0.08em;
      animation: titleGlow 4s ease-in-out infinite;
    }

    .main-subtitle {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--purple-mid);
      letter-spacing: 0.35em;
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(212,168,67,.5), 0 0 40px rgba(212,168,67,.2); }
      50%       { text-shadow: 0 0 30px rgba(212,168,67,.8), 0 0 60px rgba(212,168,67,.4), 0 0 90px rgba(212,168,67,.15); }
    }

    /* ── Phases ── */
    .phase { width: 100%; max-width: 680px; animation: fadeUp .6s ease both; }
    .phase.hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Input phase ── */
    .phase-label {
      text-align: center;
      font-size: 1.05rem;
      color: var(--purple-light);
      margin-bottom: 1.6rem;
      letter-spacing: 0.05em;
    }

    .crystal-orb {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #9f6ee0, #4a1070 60%, #1a0040);
      box-shadow: 0 0 30px rgba(155,61,171,.5), 0 0 60px rgba(155,61,171,.2), inset 0 0 20px rgba(255,255,255,.1);
      animation: orbPulse 3s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(155,61,171,.5), 0 0 60px rgba(155,61,171,.2); }
      50%       { box-shadow: 0 0 50px rgba(155,61,171,.8), 0 0 100px rgba(155,61,171,.3); }
    }

    textarea.q-input {
      width: 100%;
      padding: 1.2rem 1.4rem;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: border-color .3s, box-shadow .3s, background .3s;
      backdrop-filter: blur(8px);
    }

    textarea.q-input::placeholder { color: rgba(200,180,232,.45); }

    textarea.q-input:focus {
      border-color: rgba(212,168,67,.8);
      box-shadow: 0 0 24px var(--gold-glow);
      background: rgba(255,255,255,.07);
    }

    textarea.q-input.error { border-color: rgba(220,60,60,.8); }

    .btn-primary {
      display: block;
      width: 100%;
      margin-top: 1.4rem;
      padding: 1.15rem;
      background: linear-gradient(135deg, #7b2d8b, #4a1070);
      border: 1px solid rgba(212,168,67,.55);
      border-radius: 14px;
      color: var(--gold);
      font-family: 'Noto Serif JP', serif;
      font-size: 1.05rem;
      letter-spacing: 0.25em;
      cursor: pointer;
      transition: background .3s, box-shadow .3s, transform .15s;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #9b3dab, #6a2090);
      box-shadow: 0 0 32px rgba(212,168,67,.3);
      transform: translateY(-2px);
    }

    .btn-primary:active { transform: translateY(0); }

    /* ── Shuffle phase ── */
    .shuffle-msg {
      text-align: center;
      font-size: 1.1rem;
      color: var(--purple-light);
      margin-bottom: 2.5rem;
      letter-spacing: 0.1em;
    }

    .loading-dots {
      display: flex;
      justify-content: center;
      gap: .6rem;
    }

    .loading-dots span {
      width: 12px; height: 12px;
      background: var(--gold);
      border-radius: 50%;
      animation: dotBounce 1.4s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: .2s; }
    .loading-dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(.3); opacity: .4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    /* ── Cards phase ── */
    .spread-label {
      text-align: center;
      font-size: .8rem;
      color: var(--purple-mid);
      letter-spacing: .35em;
      margin-bottom: .6rem;
    }

    .q-display {
      text-align: center;
      font-size: 1.05rem;
      color: var(--gold);
      padding: .9rem 1.2rem;
      border-top: 1px solid rgba(212,168,67,.2);
      border-bottom: 1px solid rgba(212,168,67,.2);
      margin-bottom: 1.6rem;
    }

    .reveal-hint {
      text-align: center;
      font-size: .85rem;
      color: var(--purple-mid);
      letter-spacing: .2em;
      margin-bottom: 2rem;
    }

    .cards-row {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .card-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .7rem;
      animation: fadeUp .5s ease both;
    }

    .card-slot:nth-child(2) { animation-delay: .15s; }
    .card-slot:nth-child(3) { animation-delay: .3s; }

    .pos-label {
      font-size: .78rem;
      color: var(--purple-mid);
      letter-spacing: .25em;
    }

    /* 3D flip card */
    .card-flip {
      width: 148px;
      height: 248px;
      perspective: 1200px;
      cursor: pointer;
    }

    .card-flip .inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .85s cubic-bezier(.4,0,.2,1);
    }

    .card-flip.flipped .inner { transform: rotateY(180deg); }

    .card-face, .card-back {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      border: 1px solid rgba(212,168,67,.55);
      backface-visibility: hidden;
    }

    .card-back {
      background: linear-gradient(150deg, #180440 0%, #0c0128 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 18px rgba(155,61,171,.25);
      transition: box-shadow .3s;
    }

    .card-flip:hover .card-back {
      box-shadow: 0 8px 40px rgba(0,0,0,.6), 0 0 35px rgba(155,61,171,.5);
    }

    .card-back-inner {
      width: 76%;
      height: 78%;
      border: 1px solid rgba(212,168,67,.22);
      border-radius: 10px;
      background: repeating-linear-gradient(
        45deg,
        rgba(212,168,67,.04) 0px,
        rgba(212,168,67,.04) 2px,
        transparent 2px,
        transparent 12px
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back-rune {
      font-size: 2.2rem;
      color: rgba(212,168,67,.3);
      user-select: none;
    }

    .card-face {
      background: linear-gradient(160deg, #140030 0%, #090018 100%);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem .8rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.6), 0 0 25px rgba(212,168,67,.2);
    }

    .card-face.reversed { transform: rotateY(180deg) rotate(180deg); }

    .c-number {
      font-family: 'Cinzel', cursive;
      font-size: .65rem;
      color: rgba(212,168,67,.65);
      letter-spacing: .2em;
      align-self: flex-start;
    }

    .c-symbol { font-size: 2.8rem; filter: drop-shadow(0 0 10px rgba(212,168,67,.45)); }

    .c-names { text-align: center; }
    .c-name-ja { font-size: 1rem; font-weight: 700; color: var(--text); }
    .c-name-en { font-family: 'Cinzel', cursive; font-size: .58rem; color: rgba(212,168,67,.55); letter-spacing: .08em; }
    .c-rev-badge {
      font-size: .6rem;
      color: #c06060;
      letter-spacing: .12em;
      margin-top: .25rem;
    }

    /* ── Reading phase ── */
    .reading-title {
      text-align: center;
      font-size: 1.2rem;
      color: var(--gold);
      letter-spacing: .2em;
      margin-bottom: .5rem;
    }

    .reading-q {
      text-align: center;
      font-size: .85rem;
      color: var(--purple-mid);
      margin-bottom: 2rem;
      letter-spacing: .05em;
    }

    .card-reading {
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.4rem;
      margin-bottom: 1.4rem;
      backdrop-filter: blur(6px);
      animation: fadeUp .5s ease both;
    }

    .card-reading:nth-child(3) { animation-delay: .15s; }
    .card-reading:nth-child(4) { animation-delay: .3s; }

    .reading-card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: .9rem;
    }

    .r-symbol { font-size: 1.8rem; }

    .r-pos { font-size: .7rem; color: var(--purple-mid); letter-spacing: .2em; }
    .r-name { font-size: 1rem; color: var(--gold); font-weight: 700; margin-top: .15rem; }

    .r-text {
      font-size: .92rem;
      line-height: 1.85;
      color: var(--purple-light);
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: .8rem;
    }

    .kw-tag {
      font-size: .72rem;
      padding: .2rem .65rem;
      border: 1px solid rgba(212,168,67,.28);
      border-radius: 20px;
      color: var(--purple-mid);
    }

    .overall-box {
      background: rgba(212,168,67,.05);
      border: 1px solid rgba(212,168,67,.4);
      border-radius: 14px;
      padding: 1.5rem;
      margin-top: .5rem;
      animation: fadeUp .5s ease .45s both;
    }

    .overall-title {
      text-align: center;
      font-size: .85rem;
      color: var(--gold);
      letter-spacing: .3em;
      margin-bottom: 1rem;
    }

    .overall-text {
      font-size: .93rem;
      line-height: 1.9;
      color: var(--text);
    }

    .btn-again {
      display: block;
      width: 100%;
      max-width: 380px;
      margin: 2.5rem auto 0;
      padding: .95rem;
      background: transparent;
      border: 1px solid rgba(212,168,67,.45);
      border-radius: 14px;
      color: var(--gold);
      font-family: 'Noto Serif JP', serif;
      font-size: .95rem;
      letter-spacing: .25em;
      cursor: pointer;
      transition: background .3s, box-shadow .3s;
    }

    .btn-again:hover {
      background: rgba(212,168,67,.08);
      box-shadow: 0 0 22px rgba(212,168,67,.2);
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .card-flip { width: 112px; height: 188px; }
      .c-symbol { font-size: 2rem; }
      .c-name-ja { font-size: .85rem; }
      .cards-row { gap: 1rem; }
    }
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="app">
  <header class="header">
    <h1 class="main-title">✦ Mystic Tarot ✦</h1>
    <p class="main-subtitle">神秘のタロット占い</p>
  </header>

  <!-- Phase 1: Input -->
  <div class="phase" id="phaseInput">
    <div class="crystal-orb"></div>
    <p class="phase-label">何について占いたいですか？</p>
    <textarea class="q-input" id="questionInput" rows="3"
      placeholder="恋愛、仕事、人間関係... 心に浮かんだことを自由に入力してください"></textarea>
    <button class="btn-primary" onclick="startReading()">✨ カードを引く ✨</button>
  </div>

  <!-- Phase 2: Shuffle -->
  <div class="phase hidden" id="phaseShuffle">
    <p class="shuffle-msg">カードをシャッフルしています...</p>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Phase 3: Cards face-down -->
  <div class="phase hidden" id="phaseCards" style="max-width:860px;">
    <p class="spread-label">〜 過去・現在・未来のスプレッド 〜</p>
    <p class="q-display" id="qDisplay"></p>
    <p class="reveal-hint">カードをタップして開いてください</p>
    <div class="cards-row" id="cardsRow"></div>
  </div>

  <!-- Phase 4: Reading -->
  <div class="phase hidden" id="phaseReading" style="max-width:720px;">
    <h2 class="reading-title">〜 タロットからのメッセージ 〜</h2>
    <p class="reading-q" id="readingQ"></p>
    <div id="readingCards"></div>
    <button class="btn-again" onclick="resetAll()">もう一度占う</button>
  </div>
</div>

<script>
/* ─────────────────── TAROT DATA ─────────────────── */
const CARDS = [
  { n:"0",   ja:"愚者",       en:"The Fool",         sym:"🌟",
    up:{ kw:["新たな始まり","自由","冒険","無邪気"],       msg:"新しい旅の始まりを告げています。恐れずに一歩踏み出す時です。あなたの中にある純粋な好奇心と冒険心を信じましょう。未知の世界への跳躍が、最高の贈り物をもたらします。" },
    rv:{ kw:["無謀","衝動的","準備不足","迷い"],           msg:"慎重さが求められる時期です。衝動的な行動は避け、しっかりと地に足をつけて準備を整えてから前進することをお勧めします。" }},
  { n:"I",   ja:"魔術師",     en:"The Magician",     sym:"⚡",
    up:{ kw:["意志力","創造性","スキル","集中"],            msg:"今あなたには目標を達成するための全ての力とツールが揃っています。強い意志を持って集中すれば、どんな夢も現実に変えられます。" },
    rv:{ kw:["操作","欺き","力の乱用","焦り"],              msg:"自分の力を過信していないか振り返る時です。誠実な方法で、一歩一歩丁寧に目標へ向かうことが重要です。" }},
  { n:"II",  ja:"女教皇",     en:"The High Priestess",sym:"🌙",
    up:{ kw:["直感","神秘","内なる知恵","潜在意識"],        msg:"あなたの内なる声に耳を傾けてください。見えないものの中に大切な答えが隠されています。静かに心を落ち着け、直感を信じることが重要です。" },
    rv:{ kw:["秘密","直感の無視","表面的","混乱"],          msg:"内なる声を無視していませんか？自分の感情や直感に正直になり、深いところにある真実と向き合う時期です。" }},
  { n:"III", ja:"女帝",       en:"The Empress",       sym:"🌹",
    up:{ kw:["豊かさ","母性","創造性","繁栄"],              msg:"あなたの人生に豊かさと繁栄が流れ込んでいます。創造性を発揮し、愛情を持って物事に取り組むことで、素晴らしい実りがもたらされるでしょう。" },
    rv:{ kw:["依存","過保護","創造性の阻害","不安定"],      msg:"自立することが大切です。他者への依存を減らし、自分自身の力で前進する時期です。自分を養うことから始めましょう。" }},
  { n:"IV",  ja:"皇帝",       en:"The Emperor",       sym:"👑",
    up:{ kw:["権威","安定","リーダーシップ","構造"],        msg:"強いリーダーシップと安定した基盤があなたを支えています。計画を立て、規律を持って行動することで、望む結果を得られるでしょう。" },
    rv:{ kw:["支配的","柔軟性の欠如","独裁","権力の乱用"],  msg:"頑固になりすぎていませんか？柔軟性を持ち、他者の意見にも耳を傾けることが、より良い結果をもたらします。" }},
  { n:"V",   ja:"教皇",       en:"The Hierophant",   sym:"⛩️",
    up:{ kw:["伝統","信仰","教育","道徳"],                  msg:"伝統や慣習の中に知恵があります。信頼できる人物からのアドバイスを参考にし、確立された道を歩むことが助けとなるでしょう。" },
    rv:{ kw:["反抗","固定観念","束縛","非順応"],            msg:"既存の枠にとらわれず、自分だけの道を切り開く時かもしれません。慣習を疑い、新しい視点を持ちましょう。" }},
  { n:"VI",  ja:"恋人たち",   en:"The Lovers",        sym:"💫",
    up:{ kw:["愛","調和","選択","絆"],                      msg:"愛と調和が訪れています。重要な選択を迫られているかもしれませんが、心の声に従うことで正しい道が見えてきます。真の繋がりを大切に。" },
    rv:{ kw:["不調和","決断の困難","価値観の相違","失恋"],  msg:"関係における不調和や、難しい選択に直面しているかもしれません。自分の価値観と向き合い、誠実な決断をしましょう。" }},
  { n:"VII", ja:"戦車",       en:"The Chariot",       sym:"⚔️",
    up:{ kw:["勝利","意志力","制御","突破"],                msg:"困難を乗り越え、勝利へと向かっています。強い意志と集中力があれば、どんな障害も突破できます。前進し続けてください。" },
    rv:{ kw:["制御不能","攻撃性","障害","敗北"],            msg:"コントロールを失いそうになっていませんか？一歩引いて状況を見直し、自分の感情と行動を整えることが必要です。" }},
  { n:"VIII",ja:"力",         en:"Strength",          sym:"🦁",
    up:{ kw:["勇気","忍耐","内なる力","自制心"],            msg:"あなたには想像以上の内なる力があります。柔らかさの中にある強さを発揮する時です。愛情と忍耐を持って困難に向き合えば必ず乗り越えられます。" },
    rv:{ kw:["自己不信","弱さ","恐れ","制御不能"],          msg:"自分を信じることを恐れていませんか？内なる強さを取り戻し、自己肯定感を高めることに集中しましょう。" }},
  { n:"IX",  ja:"隠者",       en:"The Hermit",        sym:"🕯️",
    up:{ kw:["内省","孤独","知恵","探求"],                  msg:"一人の時間を持ち、内省することが大切な時期です。外の世界から離れ、自分の内なる知恵に耳を傾けることで大切な洞察が得られるでしょう。" },
    rv:{ kw:["孤立","引きこもり","拒絶","孤独感"],          msg:"孤立しすぎていませんか？適度に他者との繋がりを保ちながら、内省のバランスを取ることが必要です。" }},
  { n:"X",   ja:"運命の輪",   en:"Wheel of Fortune",  sym:"☯️",
    up:{ kw:["変化","運命","サイクル","幸運"],              msg:"運命の転換点にいます。変化を恐れずに受け入れてください。宇宙のサイクルがあなたに有利に働いており、幸運な変化が訪れる時です。" },
    rv:{ kw:["不運","変化への抵抗","停滞","コントロール喪失"],msg:"変化に抵抗することで問題が生じています。流れに逆らわず、状況の自然な展開に身を委ねることが助けとなるでしょう。" }},
  { n:"XI",  ja:"正義",       en:"Justice",           sym:"⚖️",
    up:{ kw:["公平","真実","法","原因と結果"],              msg:"物事は公平に判断されます。真実と誠実さが重要な時期です。あなたの行動と選択が正当に評価され、公正な結果がもたらされるでしょう。" },
    rv:{ kw:["不公平","不誠実","偏見","責任逃れ"],          msg:"不公平な状況や不誠実な行為に注意が必要です。責任を取り、誠実に向き合うことが長期的には良い結果をもたらします。" }},

const POS_LABELS = ["過去", "現在", "未来"];
let drawn = [], question = "", flipped = 0;

/* ─────────────────── LOGIC ─────────────────── */
function startReading() {
  const q = document.getElementById('questionInput').value.trim();
  if (!q) {
    const el = document.getElementById('questionInput');
    el.classList.add('error');
    el.focus();
    setTimeout(() => el.classList.remove('error'), 2000);
    return;
  }
  question = q;
  flipped = 0;

  show('phaseShuffle');
  drawn = shuffle([...CARDS]).slice(0, 3).map(c => ({ ...c, rev: Math.random() > 0.65 }));
  setTimeout(() => { show('phaseCards'); renderCards(); }, 2000);
}

function renderCards() {
  document.getElementById('qDisplay').textContent = `「${question}」`;
  const row = document.getElementById('cardsRow');
  row.innerHTML = '';
  drawn.forEach((card, i) => {
    const slot = document.createElement('div');
    slot.className = 'card-slot';
    slot.innerHTML = `
      <span class="pos-label">${POS_LABELS[i]}</span>
      <div class="card-flip" id="cf${i}" onclick="flipCard(${i})">
        <div class="inner">
          <div class="card-back">
            <div class="card-back-inner">
              <span class="card-back-rune">✦</span>
            </div>
          </div>
          <div class="card-face${card.rev ? ' reversed' : ''}">
            <span class="c-number">${card.n}</span>
            <span class="c-symbol">${card.sym}</span>
            <div class="c-names">
              <div class="c-name-ja">${card.ja}</div>
              <div class="c-name-en">${card.en}</div>
              ${card.rev ? '<div class="c-rev-badge">逆位置</div>' : ''}
            </div>
          </div>
        </div>
      </div>`;
    row.appendChild(slot);
  });
}

function flipCard(i) {
  const el = document.getElementById('cf' + i);
  if (el.classList.contains('flipped')) return;
  el.classList.add('flipped');
  flipped++;
  if (flipped === 3) setTimeout(showReading, 900);
}

function showReading() {
  show('phaseReading');
  document.getElementById('readingQ').textContent = `「${question}」についての答え`;
  const container = document.getElementById('readingCards');
  container.innerHTML = '';

  drawn.forEach((card, i) => {
    const m = card.rev ? card.rv : card.up;
    const div = document.createElement('div');
    div.className = 'card-reading';
    div.innerHTML = `
      <div class="reading-card-header">
        <span class="r-symbol">${card.sym}</span>
        <div>
          <div class="r-pos">${POS_LABELS[i]}のカード</div>
          <div class="r-name">${card.ja}${card.rev ? '（逆位置）' : ''}</div>
        </div>
      </div>
      <p class="r-text">${m.msg}</p>
      <div class="keywords">${m.kw.map(k => `<span class="kw-tag">${k}</span>`).join('')}</div>`;
    container.appendChild(div);
  });

  const overall = document.createElement('div');
  overall.className = 'overall-box';
  overall.innerHTML = `
    <div class="overall-title">✦ 総合メッセージ ✦</div>
    <p class="overall-text">${buildOverall()}</p>`;
  container.appendChild(overall);
}

function buildOverall() {
  const [past, present, future] = drawn;
  const pk = (card) => (card.rev ? card.rv : card.up).kw[0];
  const pn = (card) => `${card.ja}${card.rev ? '（逆位置）' : ''}`;
  return `過去の「${pn(past)}」が示す${pk(past)}という経験が、現在の「${pn(present)}」が表す${pk(present)}という状況を生み出しています。タロットは、この流れの先に「${pn(future)}」という${pk(future)}のエネルギーが待っていることを告げています。今の自分を信じ、一歩一歩前進することで、あなたが求める答えは自然と形になっていくでしょう。宇宙はいつもあなたを導いています。`;
}

function resetAll() {
  document.getElementById('questionInput').value = '';
  flipped = 0;
  show('phaseInput');
}

function show(id) {
  ['phaseInput','phaseShuffle','phaseCards','phaseReading'].forEach(p => {
    document.getElementById(p).classList.toggle('hidden', p !== id);
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ─────────────────── STARFIELD ─────────────────── */
(function () {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [], shooting = [], W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars = Array.from({ length: 220 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.2,
      o: Math.random(),
      speed: Math.random() * 0.018 + 0.005,
      dir: Math.random() > .5 ? 1 : -1,
    }));
  }

  function spawnShooting() {
    if (Math.random() < 0.004) {
      shooting.push({
        x: Math.random() * W, y: Math.random() * H * 0.5,
        len: Math.random() * 120 + 60,
        speed: Math.random() * 8 + 6,
        angle: Math.PI / 6,
        life: 1,
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * .8);
    grad.addColorStop(0, '#0e0230');
    grad.addColorStop(.5, '#07011a');
    grad.addColorStop(1, '#020008');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    stars.forEach(s => {
      s.o += s.speed * s.dir;
      if (s.o >= 1 || s.o <= .05) s.dir *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.o.toFixed(2)})`;
      ctx.fill();
    });

    // Shooting stars
    spawnShooting();
    shooting = shooting.filter(s => {
      s.x += Math.cos(s.angle) * s.speed;
      s.y += Math.sin(s.angle) * s.speed;
      s.life -= 0.022;
      const tail = ctx.createLinearGradient(s.x, s.y, s.x - Math.cos(s.angle)*s.len, s.y - Math.sin(s.angle)*s.len);
      tail.addColorStop(0, `rgba(255,240,200,${s.life.toFixed(2)})`);
      tail.addColorStop(1, 'rgba(255,240,200,0)');
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - Math.cos(s.angle)*s.len, s.y - Math.sin(s.angle)*s.len);
      ctx.strokeStyle = tail;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      return s.life > 0;
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();
</script>
